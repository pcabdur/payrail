name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - run: python -m pip install -e './apps/api[dev]' -e apps/worker
      - run: forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.2.0
        working-directory: contracts
      - run: ruff check apps/api apps/worker
      - run: pytest -q
        working-directory: apps/api
      - run: pytest -q ../worker/tests
        working-directory: apps/api

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - run: forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.2.0
        working-directory: contracts
      - run: forge test --force -vv
        working-directory: contracts
