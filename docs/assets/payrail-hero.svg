    <circle cx="979" cy="163" r="9"/><circle cx="945" cy="250" r="9"/><circle cx="986" cy="255" r="9"/>
    <circle cx="1176" cy="110" r="9"/><circle cx="1166" cy="210" r="9"/><circle cx="1180" cy="330" r="9"/>
  </g>
