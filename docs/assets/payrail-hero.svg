    <text x="720" y="95">CHECKOUT</text><text x="923" y="219">VERIFY</text><text x="1167" y="76">CONFIRM</text>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="88" y="70" width="118" height="30" rx="15" fill="#143A3C" stroke="#3CDCB8" stroke-opacity=".4"/>
