<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">PayRail</title>
  <desc id="desc">Stablecoin payments with clear rails from checkout to confirmation.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="18" x2="1372" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1528"/>
      <stop offset="1" stop-color="#102D3C"/>
    </linearGradient>
    <linearGradient id="rail" x1="760" y1="120" x2="1340" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#47E3BD"/>
      <stop offset="1" stop-color="#72B8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 240 -410 0 1182 174)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36D5B4" stop-opacity=".17"/>
      <stop offset="1" stop-color="#36D5B4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#B4D3E8" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1440" height="420" rx="28" fill="url(#background)"/>
  <rect width="1440" height="420" rx="28" fill="url(#glow)"/>
