  <path d="M752 127H900C936 127 946 163 979 163H1095C1130 163 1133 110 1176 110H1330M752 210H858C900 210 905 250 945 250H1070C1112 250 1124 210 1166 210H1330M752 294H900C937 294 947 255 986 255H1098C1136 255 1141 330 1180 330H1330" stroke="url(#rail)" stroke-width="3" stroke-linecap="round" stroke-opacity=".8"/>
  <path d="M752 127H900C936 127 946 163 979 163H1095C1130 163 1133 110 1176 110H1330M752 210H858C900 210 905 250 945 250H1070C1112 250 1124 210 1166 210H1330M752 294H900C937 294 947 255 986 255H1098C1136 255 1141 330 1180 330H1330" stroke="url(#rail)" stroke-width="11" stroke-linecap="round" stroke-opacity=".08"/>
  <g fill="#0D2030" stroke="url(#rail)" stroke-width="3">
